<h1>One-time migration: Sheet → Firestore</h1>
<p>Imports the Plan and Log data exported from the Google Sheet into this
Firebase project's Firestore. Safe to run only once — running it again will
duplicate Plan rows (Log rows are safe to re-import, they use deterministic
IDs and overwrite in place).</p>

const logEl = document.getElementById('log');
function log(msg) { logEl.textContent += msg + '\n'; logEl.scrollTop = logEl.scrollHeight; }

document.getElementById('run').addEventListener('click', async () => {
  document.getElementById('run').disabled = true;
  logEl.textContent = '';

  const existingPlan = await getDocs(collection(db, 'plan'));
  if (!existingPlan.empty) {
    const proceed = confirm(`The "plan" collection already has ${existingPlan.size} documents. Importing again will duplicate Plan rows. Continue anyway?`);
    if (!proceed) { document.getElementById('run').disabled = false; log('Cancelled.'); return; }
  }

  log(`Importing ${PLAN_DATA.length} plan rows…`);
  for (const row of PLAN_DATA) {
    const { Version, ValidFrom, Day, Session, Exercise, Sets, Reps, Duration, Weight, Order, Active } = row;
    await addDoc(collection(db, 'plan'), {
      Version, ValidFrom, Day, Session, Exercise, Sets, Reps, Duration, Weight, Order,
      Active: Active === 'TRUE'
    });
  }
  log('Plan import done.');

  log(`Importing ${LOG_DATA.length} log rows…`);
  for (const row of LOG_DATA) {
    const id = logDocId(row.Date, row.Session, row.Exercise);
    await setDoc(doc(db, 'log', id), row);
  }
  log('Log import done.');

  log('\nAll done. Open index.html to check the app, then delete this file.');
  document.getElementById('run').disabled = false;
});
</script>
